# Server Configuration
server.port=8082
server.servlet.context-path=/api/payment

# Application Name
spring.application.name=payment-service

# Database Configuration (SQLite)
# Using the same DB file location convention but a different file for payments if needed, 
# or the same one. For now using a separate file to match OSGi.
spring.datasource.url=jdbc:sqlite:paymentDatabase.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.root=INFO
logging.level.com.skynet.payment=DEBUG
