# ===================================
# SEAT MANAGEMENT SERVICE CONFIG
# ===================================

# Server Configuration
server.port=8082
server.servlet.context-path=/api/seat-management

# Application Name
spring.application.name=seat-management-service

# ===================================
# DATABASE CONFIGURATION (SQLite)
# ===================================

# SQLite Database Path
# Option 1: Absolute path (replace with your actual path)
# spring.datasource.url=jdbc:sqlite:C:/Users/Aiman/.Skynet/applicationDataBase.db

# Option 2: Use user home directory
spring.datasource.url=jdbc:sqlite:${user.home}/.Skynet/applicationDataBase.db

# Driver
spring.datasource.driver-class-name=org.sqlite.JDBC

# No username/password needed for SQLite
spring.datasource.username=
spring.datasource.password=

# ===================================
# JPA / Hibernate Configuration
# ===================================

# Hibernate Dialect for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Show SQL queries in console (for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate DDL auto (update = update schema without dropping data)
# Options: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update

# ===================================
# LOGGING
# ===================================

# General logging level
logging.level.root=INFO

# Spring logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data=DEBUG

# Hibernate logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Your application logging
logging.level.com.skynet.seatmanagement=DEBUG
